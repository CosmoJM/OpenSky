# Static docs site (GitHub Pages: Settings -> Pages -> Deploy from a branch -> /docs)
title: OpenSky
description: A friendly family wall calendar and home dashboard for a Raspberry Pi touchscreen
# Layout, navigation (_data/nav.yml) and styling live in _layouts/ and assets/css/ — no remote theme
baseurl: /OpenSky
defaults:
  - scope:
      path: ""
    values:
      layout: default
plugins:
  - jekyll-relative-links
  - jekyll-readme-index
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
relative_links:
  enabled: true
  collection: false
readme_index:
  enabled: true
optional_front_matter:
  remove_originals: true
titles_from_headings:
  enabled: true
  strip_title: true
  collection: false
exclude:
  - README.md   # the site home is index.md; README.md is for browsing docs/ on GitHub
